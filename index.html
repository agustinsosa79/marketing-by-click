    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes de Google sin bloquear el render: la hoja arranca deshabilitada y la habilita src/main.tsx
         (después del primer pintado; el wordmark usa la Montserrat Black local precargada).
         src/lib/fonts.ts espera a que carguen antes de medir/partir texto. -->
    <link
      id="google-fonts"
      rel="stylesheet"
      disabled
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" />
    </noscript>
    <link rel="preload" as="font" href="/fonts/montserrat-900-latin.woff2" type="font/woff2" crossorigin />
    <!-- CSS crítico: el primer paint ya es el fondo del preloader y la app no se ve sin estilos -->
    <style>
      html { background: #f4f6fc; }
      body { margin: 0; }
      #root { visibility: hidden; }
      html[data-from-site] [data-preloader] { display: none; }
    </style>
    <!-- Llegada al inicio desde otra página del sitio (no recarga): entrada corta, sin preloader (src/lib/visit.ts) -->
    <script>
      try {
        var r = document.referrer && new URL(document.referrer), n = performance.getEntriesByType('navigation')[0]
        if (r && r.origin === location.origin && r.pathname !== location.pathname && (!n || n.type === 'navigate')) document.documentElement.setAttribute('data-from-site', '')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
