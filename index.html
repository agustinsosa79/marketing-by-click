    <link rel="icon" type="image/png" sizes="32x32" href="/media/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/media/favicon-192.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <!-- Fuentes de Google sin bloquear el render: la hoja arranca deshabilitada y la habilita src/main.tsx
         (después del primer pintado; el wordmark usa la Montserrat Black local precargada).
         src/lib/fonts.ts espera a que carguen antes de medir/partir texto. -->
    <link
      id="google-fonts"
      rel="stylesheet"
      disabled
      href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700;800;900&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Montserrat:wght@400;500;600;700;800;900&display=swap" />
    </noscript>
    <link rel="preload" as="font" href="/fonts/montserrat-900-latin.woff2" type="font/woff2" crossorigin />
    <!-- CSS crítico: el primer paint ya es el fondo del preloader y la app no se ve sin estilos -->
    <style>
      html { background: #e3e8ff; }
      body { margin: 0; }
      #root { visibility: hidden; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
