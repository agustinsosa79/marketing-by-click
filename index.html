    <link rel="icon" type="image/svg+xml" href="/media/favicon.svg" />
    <link rel="icon" type="image/png" sizes="32x32" href="/media/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/media/favicon-192.png" />
    <link rel="apple-touch-icon" href="/media/apple-touch-icon-180.png" />

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="es_AR" />
    <meta property="og:site_name" content="Clic Studio" />
    <meta property="og:title" content="Estudio de marketing digital y redes sociales | Clic Studio" />
    <meta property="og:description" content="Estrategia, contenido para redes sociales y anuncios en Instagram y Facebook para que tu marca venda más." />
    <meta property="og:url" content="https://marketingbyclic.com/" />
    <meta property="og:image" content="https://marketingbyclic.com/media/founder-ian.webp" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="canonical" href="https://marketingbyclic.com/" />
    <link rel="alternate" type="application/rss+xml" title="Blog de Clic Studio" href="/blog/rss.xml" />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "ProfessionalService",
        "name": "Clic Studio",
        "description": "Estudio de marketing digital y redes sociales (agencia de redes): estrategia, contenido, anuncios en Instagram y Facebook (Meta Ads) y diseño para que tu marca venda más.",
        "url": "https://marketingbyclic.com/",
        "logo": "https://marketingbyclic.com/media/logo-clic-studio.png",
        "image": "https://marketingbyclic.com/media/founder-ian.webp",
        "telephone": "+5492944126756",
        "founder": { "@type": "Person", "name": "Ian" },
        "sameAs": ["https://www.instagram.com/clicstd/", "https://www.instagram.com/ianmarketer"],
        "knowsAbout": ["Marketing digital", "Redes sociales", "Meta Ads", "Publicidad en Instagram y Facebook", "Branding", "Contenido para redes sociales"]
      }
    </script>

    <!-- Tipografía de marca (Carlito = Calibri del manual), local: regular y bold precargadas para el primer pintado -->
    <link rel="preload" as="font" href="/fonts/carlito-700.woff2" type="font/woff2" crossorigin />
    <link rel="preload" as="font" href="/fonts/carlito-400.woff2" type="font/woff2" crossorigin />
    <!-- CSS crítico: el primer paint ya es el fondo del preloader y la app no se ve sin estilos -->
    <style>
      html { background: #ffffff; }
      body { margin: 0; }
      #root { visibility: hidden; }
      html[data-from-site] [data-preloader] { display: none; }
    </style>
    <!-- Llegada al inicio desde otra página del sitio (no recarga): entrada corta, sin preloader (src/lib/visit.ts) -->
    <script>
      try {
        var r = document.referrer && new URL(document.referrer), n = performance.getEntriesByType('navigation')[0]
        if (r && r.origin === location.origin && r.pathname !== location.pathname && (!n || n.type === 'navigate')) document.documentElement.setAttribute('data-from-site', '')
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
